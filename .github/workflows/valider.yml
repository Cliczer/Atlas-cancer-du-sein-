name: Déploiement Atlas SENORIF

on:
  push:
    branches: [ "main", "master" ]

# ⚠️ C'est ce bloc manquant qui causait ton "Timeout"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ÉTAPE 1 : Validation des données
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Vérifier les fichiers JSON
        run: node scripts/valider.mjs

  # ÉTAPE 2 : Déploiement (Ne se lance que si l'étape 1 réussit)
  deploy:
    needs: validation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Uploader les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # On envoie tout le dossier racine (index.html, src, public)
          
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
